async function confirmOrder() {
  if (!cart.length) { toast('La commande est vide'); return; }
  const client = document.getElementById('clientIn').value.trim();
  if (!client) { toast('Veuillez entrer un nom de client'); return; }
  // Vérifier le kiosque source
  let kiosqueSource = '';
  if (currentUser.role === 'vendeur') {
    kiosqueSource = currentUser.kiosque || '';
  } else {
    kiosqueSource = currentKiosqueSource;
  }
  if (!kiosqueSource) { toast('Sélectionner un kiosque source'); return; }

  // Vérifier le stock (on ne déduit pas encore)
  for (const item of cart) {
    const p = products.find(x=>x.id===item.id);
    if (!p || isFood(p)) continue;
    const qtyStock = (stockVendeur[kiosqueSource] && stockVendeur[kiosqueSource][item.id]) || 0;
    if (qtyStock < item.qty) { toast('Stock insuffisant pour : '+item.name+' dans le kiosque '+kiosqueSource); return; }
  }

  const order = {
    id:       genId(),
    date:     today(),
    time:     nowTime(),
    client:   client,
    caissier: currentUser.name,
    vendeur:  currentUser.kiosque || currentUser.name,
    kiosqueSource: kiosqueSource,
    note:     document.getElementById('noteIn').value,
    items:    cart.map(c=>({...c})),
    total:    cart.reduce((s,c)=>s+c.price*c.qty,0),
    status:   'en_attente'  // nouvelle commande en attente de validation paiement
  };

  orders.push(order);
  await saveFB('cb_orders', orders);
  logAction('Commande prise', 'Commande ' + order.id + ' - Client: ' + client + ' - Kiosque source: ' + kiosqueSource + ' - Total ' + fmt(order.total));
  toast('Commande '+order.id+' en attente de validation par le kiosque');
  clearCart();
  updateQueueBadge();
}

async function validatePayment(id) {
  const o = orders.find(x=>x.id===id);
  if (!o) return;
  if (o.status !== 'en_attente') { toast('Cette commande ne peut pas être validée'); return; }
  const kiosque = o.kiosqueSource;
  if (!kiosque) { toast('Kiosque source manquant'); return; }
  // Vérifier le stock (normalement déjà vérifié à la création, mais on revérifie)
  for (const item of o.items) {
    const p = products.find(x=>x.id===item.id);
    if (!p || isFood(p)) continue;
    const qtyStock = (stockVendeur[kiosque] && stockVendeur[kiosque][item.id]) || 0;
    if (qtyStock < item.qty) {
      toast('Stock insuffisant pour : '+item.name+' dans le kiosque '+kiosque);
      return;
    }
  }
  // Déduire le stock
  for (const item of o.items) {
    const p = products.find(x=>x.id===item.id);
    if (!p || isFood(p)) continue;
    if (!stockVendeur[kiosque]) stockVendeur[kiosque] = {};
    stockVendeur[kiosque][item.id] = Math.max(0, (stockVendeur[kiosque][item.id]||0) - item.qty);
    await logStockMvt(item.id, 'vente', item.qty, stockVendeur[kiosque][item.id], kiosque, `Commande ${o.id} - validée`);
  }
  o.status = 'attente'; // passage en cuisine
  await saveFB('cb_orders', orders);
  await saveFB('cb_stock_vendeur', stockVendeur);
  logAction('Validation paiement', 'Commande ' + o.id + ' validée par ' + currentUser.name + ' - Kiosque: ' + kiosque);
  toast('Paiement validé, commande envoyée en cuisine');
  renderQueue();
  updateQueueBadge();
}

async function setOrderStatus(id, status) {
  // Pour les autres transitions (preparation, servie)
  const o = orders.find(x=>x.id===id);
  if (!o) return;
  if (o.status === 'en_attente' && status !== 'annulee') {
    toast('Cette commande doit d\'abord être validée par le kiosque');
    return;
  }
  o.status = status;
  await saveFB('cb_orders', orders);
  logAction('Changement statut', 'Commande ' + id + ' passe a ' + status);
  renderQueue();
  toast('Statut mis à jour');
}

  tabsContainer.innerHTML = tabsHtml;

  // Afficher le contenu par défaut (le premier onglet actif)
  const activeTab = document.querySelector('.stock-tab-btn.act')?.dataset.tab || 'tous';
  renderStockContent(activeTab);
}

function switchStockTab(tab) {
  document.querySelectorAll('.stock-tab-btn').forEach(b => b.classList.remove('act'));
  document.querySelector(`.stock-tab-btn[data-tab="${tab}"]`)?.classList.add('act');
  renderStockContent(tab);
}

function renderStockContent(tab) {
  const container = document.getElementById('stockContent');
  const isAdmin = currentUser.role === 'admin';
  const isVendeur = currentUser.role === 'vendeur';
  const isServeur = currentUser.role === 'serveur' || currentUser.role === 'comptable';

  let html = '';

  if (tab === 'tous') {
    // Vue croisée : tous les produits et tous les kiosques
    const productsAStock = products.filter(p => !isFood(p));
    if (!productsAStock.length) {
      html = '<div style="color:var(--muted);padding:.5rem;">Aucun produit avec stock</div>';
    } else {
      const kiosques = users.filter(u => u.role === 'vendeur' && u.kiosque).map(u => u.kiosque);
      const uniqueKiosques = [...new Set(kiosques)];
      if (!uniqueKiosques.length) {
        html = '<div style="color:var(--muted);padding:.5rem;">Aucun kiosque enregistré</div>';
      } else {
        let tableHtml = `<div class="tbl-wrap"><table><thead><tr><th>Produit</th>`;
        uniqueKiosques.forEach(k => {
          tableHtml += `<th>${k}</th>`;
        });
        if (isAdmin) tableHtml += `<th>Actions</th>`;
        tableHtml += `</tr></thead><tbody>`;
        productsAStock.forEach(p => {
          tableHtml += `<tr><td><strong>${p.name}</strong></td>`;
          uniqueKiosques.forEach(k => {
            const qty = (stockVendeur[k] && stockVendeur[k][p.id]) || 0;
            const cls = getStockClass(qty);
            tableHtml += `<td><span class="sc-stock ${cls}">${qty}</span> ${qty<=0?'🚫':qty<=5?'⚠️':''}</td>`;
          });
          if (isAdmin) {
            tableHtml += `<td>
              <button class="icon-btn" onclick="openAdjustStock('${p.id}')" title="Ajuster pour tous">⚙️</button>
            </td>`;
          }
          tableHtml += `</tr>`;
        });
        tableHtml += `</tbody></table></div>`;
        html = tableHtml;
        if (isAdmin) {
          html += `<div style="margin-top:1rem;">
            <p style="font-size:.8rem;color:var(--muted);">Cliquez sur ⚙️ pour ajuster le stock de ce produit dans tous les kiosques.</p>
          </div>`;
        }
      }
    }
  } else {
    // Vue par kiosque individuel
    const kiosque = tab;
    const productsAStock = products.filter(p => !isFood(p));
    if (!productsAStock.length) {
      html = '<div style="color:var(--muted);padding:.5rem;">Aucun produit avec stock</div>';
    } else {
      html = productsAStock.map(p => {
        const qty = (stockVendeur[kiosque] && stockVendeur[kiosque][p.id]) || 0;
        const cls = getStockClass(qty);
        return `<div class="stock-card ${qty<=0?'out':qty<=5?'low':''}">
          <div class="sc-info">
            <div class="sc-name">${getCatIcon(p.cat)} ${p.name}</div>
            <div class="sc-cat">${p.cat} -- ${fmt(p.price)}</div>
            <div class="sc-stock ${cls}">${qty} unite(s) -- ${getStockLabel(qty)}</div>
          </div>
          ${isAdmin ? `
          <div class="sc-controls">
            <input type="number" class="stock-adj-input" id="si-${p.id}-${kiosque}" value="1" min="0">
            <button class="stock-adj-btn stock-set-btn" onclick="adjustStockKiosque('${kiosque}',${p.id},'set')">Définir</button>
            <button class="stock-adj-btn stock-add-btn" onclick="adjustStockKiosque('${kiosque}',${p.id},'add')">+ Reassort</button>
            <button class="stock-adj-btn stock-sub-btn" onclick="adjustStockKiosque('${kiosque}',${p.id},'sub')">- Perte</button>
          </div>` : (isVendeur ? `<div style="font-size:.75rem;color:var(--muted);">Mon stock</div>` : `<div style="font-size:.75rem;color:var(--muted);">Stock du kiosque</div>`)}
        </div>`;
      }).join('');
    }
  }

  container.innerHTML = html;

  // Historique des mouvements (commun)
  renderStockMvt();
}

function renderStockMvt() {
  const tb = document.getElementById('mvtTable');
  if (!stockMvts.length) {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:1.5rem;color:var(--muted)">Aucun mouvement enregistre</td></tr>';
    return;
  }
  const typeMap   = {vente:'bg-r',reassort:'bg-g',ajustement:'bg-b',perte:'bg-a'};
  const typeLabel = {vente:'Vente',reassort:'Reassort',ajustement:'Ajust.',perte:'Perte'};
  let filteredMvts = stockMvts;
  if (currentUser.role === 'vendeur') {
    const monKiosque = currentUser.kiosque;
    filteredMvts = stockMvts.filter(m => m.kiosque === monKiosque);
  }
  const displayMvts = filteredMvts.slice(0,60);
  tb.innerHTML = displayMvts.map(m=>`<tr>
    <td style="font-size:.75rem">${m.ts}</td>
    <td><strong>${m.prodName}</strong></td>
    <td><span style="font-size:.7rem;color:var(--muted)">${getCatIcon(m.prodCat||'')} ${m.prodCat||'--'}</span></td>
    <td><span class="badge ${typeMap[m.type]||'bg-b'}">${typeLabel[m.type]||m.type}</span></td>
    <td><strong style="color:${m.type==='vente'||m.type==='perte'?'var(--red)':'var(--green)'}">${m.type==='vente'||m.type==='perte'?'-':'+'}${m.qty}</strong></td>
    <td>${m.stockAfter}</td>
    <td style="font-size:.75rem">${m.by}</td>
    <td style="font-size:.75rem">${m.kiosque||'--'}</td>
  </tr>`).join('');
  if (!displayMvts.length) {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:1.5rem;color:var(--muted)">Aucun mouvement pour vous</td></tr>';
  }
}

// Fonctions d'ajustement de stock (admin)
function openAdjustStock(prodId) {
  // On peut ouvrir une modale pour définir la quantité dans chaque kiosque
  // Ou directement utiliser les champs dans la vue "Tous". Pour simplifier, on va juste toast.
  toast('Utilisez la vue par kiosque pour ajuster');
}

function adjustStockKiosque(kiosque, prodId, mode) {
  if (currentUser.role !== 'admin') { toast('Reservé à l\'admin'); return; }
  const inp = document.getElementById(`si-${prodId}-${kiosque}`);
  if (!inp) return;
  const val = parseInt(inp.value)||0;
  if (val<=0 && mode!=='set') { toast('Entrer une quantité valide'); return; }
  if (!stockVendeur[kiosque]) stockVendeur[kiosque] = {};
  const before = stockVendeur[kiosque][prodId] || 0;
  let after = before;
  if (mode==='set') after = Math.max(0, val);
  else if (mode==='add') after = before + val;
  else if (mode==='sub') after = Math.max(0, before - val);
  stockVendeur[kiosque][prodId] = after;
  saveFB('cb_stock_vendeur', stockVendeur);
  logStockMvt(prodId, mode==='add'?'reassort':mode==='sub'?'perte':'ajustement', Math.abs(after-before), after, kiosque, 'Ajustement admin');
  logAction('Ajustement stock', 'Kiosque '+kiosque+' - Produit '+products.find(p=>p.id===prodId)?.name+' - '+mode+' '+val+' (avant '+before+', après '+after+')');
  renderStockContent(document.querySelector('.stock-tab-btn.act')?.dataset.tab || 'tous');
  if (currentPage==='caisse') renderProds();
  toast('Stock mis à jour');
}

// ========== INIT ==========
function initStock() {
  const kiosques = users.filter(u => u.role === 'vendeur' && u.kiosque).map(u => u.kiosque);
  let changed = false;
  products.forEach(p => {
    if (isFood(p)) return;
    kiosques.forEach(k => {
      if (!stockVendeur[k]) stockVendeur[k] = {};
      if (stockVendeur[k][p.id] === undefined) {
        stockVendeur[k][p.id] = 20;
        changed = true;
      }
    });
  });
  if (changed) saveLS('cb_stock_vendeur', stockVendeur);
}
initStock();
loadFB().then(()=>{ initStock(); });
setInterval(()=>{ loadFB(); }, 30000);
