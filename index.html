<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Complexe Beyla - Gestion Sécurisée</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ===== VARIABLES & RESET ===== */
:root {
  --bg:#f0ede8;--surface:#fff;--surface2:#f7f5f2;--border:#e0dbd3;
  --text:#18150f;--muted:#8a8278;--accent:#b84a1a;--accent2:#f5f0eb;
  --green:#1a6b3a;--green-bg:#e8f5ee;--red:#b91c1c;--red-bg:#fef2f2;
  --amber:#92580a;--amber-bg:#fdf6e3;--blue:#1a4a8a;--blue-bg:#e8f0fb;
  --orange:#c2410c;--orange-bg:#fff7ed;
  --r:10px;--r-lg:14px;--sh:0 2px 12px rgba(0,0,0,.07);
  --nav-h:56px;--bottom-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
input,select,textarea,button{font-family:inherit;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem;overflow:hidden;}
#loginScreen::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#0d1b2a 0%,#1a2e4a 40%,#2d1a0e 100%);z-index:0;}
.login-wrap{position:relative;z-index:2;width:100%;max-width:420px;}
.login-brand{text-align:center;margin-bottom:2rem;}
.login-brand-name{font-family:'DM Serif Display',serif;font-size:2.2rem;color:#fff;letter-spacing:.02em;}
.login-brand-sub{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:6px;letter-spacing:.2em;}
.login-box{background:rgba(255,255,255,.97);border-radius:20px;padding:2rem;box-shadow:0 32px 80px rgba(0,0,0,.45);}
.role-chips{display:flex;gap:6px;margin-bottom:1.2rem;}
.role-chip{flex:1;padding:9px 6px;border:1.5px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);}
.role-chip.sel{border-color:var(--accent);background:var(--accent2);color:var(--accent);}
.login-label{font-size:.68rem;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;}
.login-input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px 13px;font-size:.95rem;outline:none;margin-bottom:10px;background:var(--surface2);}
.login-input:focus{border-color:var(--accent);background:#fff;}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:6px;}
.login-err{color:var(--red);font-size:.82rem;margin-top:8px;text-align:center;}
.login-sync{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:1.2rem;font-size:.7rem;color:rgba(255,255,255,.5);}

/* HEADER */
.header{background:var(--text);height:var(--nav-h);display:flex;align-items:center;padding:0 1.2rem;gap:1rem;position:sticky;top:0;z-index:100;}
.h-logo{font-family:'DM Serif Display',serif;color:#fff;font-size:1.15rem;}
.h-role{font-size:.65rem;background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);padding:3px 9px;border-radius:20px;}
.h-space{flex:1;}
.h-user{color:rgba(255,255,255,.6);font-size:.82rem;display:none;}
.h-nav{display:flex;gap:4px;}
.hn{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);padding:6px 13px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:500;}
.hn.act{background:var(--accent);border-color:var(--accent);color:#fff;}
.h-actions{display:flex;align-items:center;gap:6px;}
.h-sync{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;}
.pwd-btn,.logout-btn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-h);background:var(--text);border-top:1px solid rgba(255,255,255,.1);justify-content:space-around;align-items:center;padding:0 4px;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:rgba(255,255,255,.5);cursor:pointer;padding:8px 4px;font-size:.62rem;font-weight:600;text-transform:uppercase;}
.bn-item.act{color:#fff;}
.bn-icon{font-size:1.3rem;}

/* PAGE et conteneurs */
.page{display:none;}
.page.act{display:block;}
.inner-page{padding:1.2rem 1.5rem;overflow-y:auto;height:calc(100vh - var(--nav-h));}
.dashboard-wrap{padding:1.5rem;overflow-y:auto;height:calc(100vh - var(--nav-h));}
.dash-welcome-title{font-family:'DM Serif Display',serif;font-size:1.7rem;margin-bottom:.2rem;}
.dash-welcome-sub{font-size:.82rem;color:var(--muted);margin-bottom:1.5rem;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.5rem;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.kpi-card.green::before{background:var(--green);}
.kpi-card.red::before{background:var(--red);}
.kpi-card.amber::before{background:var(--amber);}
.kpi-card.blue::before{background:var(--blue);}
.kpi-icon{font-size:1.5rem;margin-bottom:.4rem;}
.kpi-val{font-size:1.4rem;font-weight:700;}
.kpi-label{font-size:.68rem;color:var(--muted);}

/* CAISSE */
.caisse-wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - var(--nav-h));overflow:hidden;}
.left-p{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px;overflow-y:auto;}
.prod-card{border:1px solid var(--border);border-radius:var(--r);padding:10px;cursor:pointer;background:var(--surface);}
.prod-card.unavail{opacity:.4;cursor:not-allowed;}
.prod-name{font-weight:600;}
.prod-price{font-weight:700;color:var(--accent);}
.prod-stock{font-size:.65rem;margin-top:3px;}
.right-p{display:flex;flex-direction:column;overflow:hidden;}
.order-items{flex:1;overflow-y:auto;padding:10px 1.2rem;}
.order-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;}
.qty-ctrl{display:flex;gap:4px;}
.qb{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer;}
.order-foot{background:var(--surface);border-top:1px solid var(--border);padding:.8rem 1.2rem;}
.act-row{display:flex;gap:6px;}
.btn{padding:11px;border-radius:var(--r);border:none;cursor:pointer;font-weight:600;flex:1;}
.btn-ghost{background:var(--bg);border:1px solid var(--border);}
.btn-ok{background:var(--accent);color:#fff;}
.floating-validate{display:none;position:fixed;bottom:calc(var(--bottom-h) + 8px);left:0;right:0;padding:0 16px;z-index:999;}
.floating-validate button{width:100%;background:var(--accent);color:#fff;padding:15px;border:none;border-radius:50px;font-weight:700;font-size:1rem;}

/* autres tables, cartes... */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th,td{padding:8px 10px;text-align:left;}
.badge{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.bg-g{background:var(--green-bg);color:var(--green);}
.bg-r{background:var(--red-bg);color:var(--red);}
.bg-a{background:var(--amber-bg);color:var(--amber);}
.bg-b{background:var(--blue-bg);color:var(--blue);}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:1.5rem;max-width:480px;margin:auto;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:500;}
.overlay.open{display:flex;}
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;}
.sync-dot.online{background:var(--green);}
/* responsive */
@media(min-width:768px){.h-user{display:block;}}
@media(max-width:640px){
  .h-nav,.logout-btn,.pwd-btn,.h-role{display:none;}
  .bottom-nav{display:flex;}
  .caisse-wrap{flex-direction:column;}
  .prod-grid{grid-template-columns:1fr 1fr;}
  .floating-validate{display:block;}
  .order-foot{margin-bottom:70px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-brand-name">Complexe Beyla</div>
      <div class="login-brand-sub">Gestion sécurisée</div>
    </div>
    <div class="login-box">
      <div class="role-chips" id="roleChips">
        <div class="role-chip sel" onclick="selRole('admin',this)">Admin</div>
        <div class="role-chip" onclick="selRole('comptable',this)">Comptable</div>
        <div class="role-chip" onclick="selRole('caissier',this)">Caissier</div>
        <div class="role-chip" onclick="selRole('cuisiniere',this)">Cuisinière</div>
      </div>
      <label class="login-label">Nom d'utilisateur</label>
      <input class="login-input" id="loginUser" autocomplete="off">
      <label class="login-label">Mot de passe</label>
      <input class="login-input" id="loginPass" type="password">
      <button class="login-btn" onclick="doLogin()">Se connecter</button>
      <div class="login-err" id="loginErr"></div>
    </div>
    <div class="login-sync"><span class="sync-dot" id="loginSyncDot"></span> Synchronisation</div>
  </div>
</div>

<div id="app" style="display:none;">
<header class="header">
  <div class="h-logo">Complexe Beyla</div>
  <div class="h-role" id="hRole"></div>
  <div class="h-space"></div>
  <div class="h-nav" id="hNav"></div>
  <div class="h-user" id="hUser"></div>
  <div class="h-actions">
    <span class="sync-dot" id="headerSyncDot"></span>
    <button class="pwd-btn" onclick="openChangePwd()">Mot de passe</button>
    <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
  </div>
</header>

<!-- pages -->
<div id="pg-accueil" class="page"><div class="dashboard-wrap" id="dashboardContent"></div></div>
<div id="pg-caisse" class="page"><div id="caisseContent"></div></div>
<div id="pg-journal" class="page"><div class="inner-page" id="journalContent"></div></div>
<div id="pg-verif" class="page"><div class="inner-page" id="verifContent"></div></div>
<div id="pg-queue" class="page"><div class="inner-page" id="queueContent"></div></div>
<div id="pg-cuisine" class="page"><div class="inner-page" id="dispoContent"></div></div>
<div id="pg-stock" class="page"><div class="inner-page" id="stockContent"></div></div>
<div id="pg-admin" class="page"><div class="inner-page" id="adminContent"></div></div>
</div>

<div class="bottom-nav" id="bottomNav"></div>
<div class="floating-validate" id="floatingValidate"><button onclick="confirmOrder()">Valider la commande</button></div>

<!-- modals -->
<div class="overlay" id="modalOrder"><div class="modal"><h3>Détail commande</h3><div id="modalOrderContent"></div><div class="modal-acts"><button class="btn btn-ghost" onclick="closeModal('modalOrder')">Fermer</button></div></div></div>
<div class="overlay" id="modalUser"><div class="modal"><h3 id="modalUserTitle">Compte</h3><div class="form-group"><label>Nom</label><input class="form-in" id="uName"></div><div class="form-group"><label>Login</label><input class="form-in" id="uLogin"></div><div class="form-group"><label>Mot de passe</label><input class="form-in" id="uPass" type="password"></div><div class="form-group"><label>Rôle</label><select class="form-in" id="uRole"><option value="admin">Admin</option><option value="comptable">Comptable</option><option value="caissier">Caissier</option><option value="cuisiniere">Cuisinière</option></select></div><div class="modal-acts"><button class="btn btn-ghost" onclick="closeModal('modalUser')">Annuler</button><button class="btn btn-ok" onclick="saveUser()">Enregistrer</button></div></div></div>
<div class="overlay" id="modalProd"><div class="modal"><h3 id="modalProdTitle">Produit</h3><div class="form-group"><label>Nom</label><input class="form-in" id="pName"></div><div class="form-group"><label>Prix</label><input class="form-in" id="pPrice" type="number"></div><div class="form-group"><label>Catégorie</label><select class="form-in" id="pCat"><option>Nourriture</option><option>Boissons</option><option>Chicha</option><option>Snacks</option><option>Desserts</option></select></div><div class="form-group"><label>Stock initial (si Boissons/Chicha)</label><input class="form-in" id="pStock" type="number" value="20"></div><div class="modal-acts"><button class="btn btn-ghost" onclick="closeModal('modalProd')">Annuler</button><button class="btn btn-ok" onclick="saveProd()">Enregistrer</button></div></div></div>
<div class="overlay" id="modalPwd"><div class="modal"><h3>Modifier mot de passe</h3><div class="form-group"><label>Ancien</label><input class="form-in" id="pwdOld" type="password"></div><div class="form-group"><label>Nouveau</label><input class="form-in" id="pwdNew" type="password"></div><div class="form-group"><label>Confirmation</label><input class="form-in" id="pwdConf" type="password"></div><div id="pwdErr" style="color:red"></div><div class="modal-acts"><button class="btn btn-ghost" onclick="closeModal('modalPwd')">Annuler</button><button class="btn btn-ok" onclick="doChangePwd()">Enregistrer</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
// ========== CONFIGURATION ET DONNEES PAR DEFAUT ==========
const DEFAULT_USERS = [
  {id:1, name:'Administrateur', login:'admin', pass:'admin123', role:'admin'},
  {id:2, name:'Caissier principal', login:'caissier', pass:'caisse1', role:'caissier'},
  {id:3, name:'Cuisinière', login:'cuisine', pass:'cuisine1', role:'cuisiniere'},
  {id:4, name:'Comptable', login:'compta', pass:'compta1', role:'comptable'}
];
const DEFAULT_PRODUCTS = [
  {id:1, name:'Riz Sauce Arachide', price:25000, cat:'Nourriture'},
  {id:2, name:'Poulet Braisé', price:35000, cat:'Nourriture'},
  {id:3, name:'Eau Minérale', price:5000, cat:'Boissons', stockable:true, stock:50},
  {id:4, name:'Jus Naturel', price:8000, cat:'Boissons', stockable:true, stock:30},
  {id:5, name:'Chicha Simple', price:50000, cat:'Chicha', stockable:true, stock:10},
  {id:6, name:'Chicha Fruits', price:70000, cat:'Chicha', stockable:true, stock:8},
  {id:7, name:'Popcorn', price:5000, cat:'Snacks'},
  {id:8, name:'Crème Glacée', price:15000, cat:'Desserts'}
];
let users = JSON.parse(localStorage.getItem('cb_users')) || DEFAULT_USERS;
let products = JSON.parse(localStorage.getItem('cb_prods')) || DEFAULT_PRODUCTS;
let orders = JSON.parse(localStorage.getItem('cb_orders')) || [];
let dispo = JSON.parse(localStorage.getItem('cb_dispo')) || {};
let verifs = JSON.parse(localStorage.getItem('cb_verifs')) || {};
let stock = JSON.parse(localStorage.getItem('cb_stock')) || {};
let logs = JSON.parse(localStorage.getItem('cb_logs')) || [];

let currentUser = null, cart = [], editUserId = null, editProdId = null, viewOrderId = null;
let queueFilter = 'tous', activeCat = 'Tout', syncInProgress = false;
let sessionTimer = null;

// Firebase init (identique)
const fbConfig = { apiKey:"AIzaSyChu30n42dZaGKZmjyrHsJdEg9UoRbRpyw", authDomain:"complexe-beyla.firebaseapp.com", databaseURL:"https://complexe-beyla-default-rtdb.europe-west1.firebasedatabase.app", projectId:"complexe-beyla", storageBucket:"complexe-beyla.firebasestorage.app", messagingSenderId:"402067946689", appId:"1:402067946689:web:9d71e1f9ae523da40ae840" };
firebase.initializeApp(fbConfig);
const db = firebase.database();

async function saveFB(key, data) { localStorage.setItem(key, JSON.stringify(data)); try { await db.ref('beyla/'+key).set(data); setSyncDot(true); } catch(e){ setSyncDot(false); } }
async function loadFB() { try { const keys = ['cb_users','cb_prods','cb_orders','cb_dispo','cb_verifs','cb_stock','cb_logs']; for(let k of keys){ let snap = await db.ref('beyla/'+k).once('value'); if(snap.exists()){ let val=snap.val(); localStorage.setItem(k,JSON.stringify(val)); if(k==='cb_users') users=val; if(k==='cb_prods') products=val; if(k==='cb_orders') orders=val; if(k==='cb_dispo') dispo=val; if(k==='cb_verifs') verifs=val; if(k==='cb_stock') stock=val; if(k==='cb_logs') logs=val; } } setSyncDot(true); return true; } catch(e){ setSyncDot(false); return false; } }
function setSyncDot(online){ ['loginSyncDot','headerSyncDot'].forEach(id=>{ let el=document.getElementById(id); if(el){ el.classList.toggle('online',online); el.classList.toggle('offline',!online); } }); }

// ========== LOGS DE SECURITE ==========
async function addLog(action, details) { let log = { timestamp: new Date().toLocaleString(), user: currentUser?.name || 'system', role: currentUser?.role || 'system', action, details, id: Date.now()+'-'+Math.random().toString(36).substr(2,5) }; logs.unshift(log); if(logs.length>500) logs=logs.slice(0,500); await saveFB('cb_logs', logs); }

// ========== SESSION EXPIRE ==========
function resetSessionTimer() { if(sessionTimer) clearTimeout(sessionTimer); sessionTimer = setTimeout(()=>{ if(currentUser){ toast('Session expirée (inactivité)'); doLogout(); } }, 2*60*60*1000); }
document.addEventListener('mousemove', resetSessionTimer); document.addEventListener('click', resetSessionTimer); document.addEventListener('keydown', resetSessionTimer);

// ========== FONCTIONS UTILES ==========
function fmt(n){ return Number(n).toLocaleString('fr-FR')+' GNF'; }
function today(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function genId(){ return 'CMD-'+String(orders.length+1).padStart(4,'0')+'-'+Date.now().toString(36).slice(-3).toUpperCase(); }
function toast(msg){ let t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

// vérifier si un produit doit utiliser le stock (boissons ou chicha)
function isStockable(prod){ return prod.cat === 'Boissons' || prod.cat === 'Chicha'; }

// Initialiser stock pour produits stockables
function initStock(){ products.forEach(p=>{ if(isStockable(p) && stock[p.id]===undefined) stock[p.id]=p.stock || 20; else if(!isStockable(p)) delete stock[p.id]; }); saveFB('cb_stock',stock); }

// ========== LOGIN ==========
let selRoleVal='admin';
function selRole(r,el){ selRoleVal=r; document.querySelectorAll('.role-chip').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); }
async function doLogin(){ let login=document.getElementById('loginUser').value.trim(), pass=document.getElementById('loginPass').value; await loadFB(); initStock(); let u=users.find(x=>x.login===login && x.pass===pass && x.role===selRoleVal); if(!u){ document.getElementById('loginErr').innerText='Identifiants incorrects'; return; } currentUser=u; document.getElementById('loginScreen').style.display='none'; document.getElementById('app').style.display='block'; initApp(); resetSessionTimer(); addLog('Connexion',`Connexion en tant que ${u.role}`); }
function doLogout(){ if(currentUser) addLog('Déconnexion',`${currentUser.name} s'est déconnecté`); currentUser=null; cart=[]; document.getElementById('app').style.display='none'; document.getElementById('loginScreen').style.display='flex'; document.getElementById('loginErr').innerText=''; document.getElementById('loginUser').value=''; document.getElementById('loginPass').value=''; if(sessionTimer) clearTimeout(sessionTimer); }

// ========== NAVIGATION / ROLES ==========
const NAV_MAP = {
  admin: [{id:'accueil',label:'Accueil',icon:'🏠'},{id:'caisse',label:'Caisse',icon:'🛒'},{id:'journal',label:'Journal',icon:'📋'},{id:'verif',label:'Vérif',icon:'✅'},{id:'queue',label:'Cuisine',icon:'🍳'},{id:'cuisine',label:'Dispo',icon:'🔆'},{id:'stock',label:'Stock',icon:'📦'},{id:'admin',label:'Admin',icon:'⚙️'}],
  comptable: [{id:'accueil',label:'Accueil',icon:'🏠'},{id:'caisse',label:'Caisse',icon:'🛒'},{id:'journal',label:'Journal',icon:'📋'},{id:'verif',label:'Vérif',icon:'✅'},{id:'queue',label:'Cuisine',icon:'🍳'}],
  caissier: [{id:'caisse',label:'Caisse',icon:'🛒'}],
  cuisiniere: [{id:'queue',label:'Commandes',icon:'🍳'}]
};
function initApp(){
  document.getElementById('hRole').innerHTML = {admin:'Admin',comptable:'Comptable',caissier:'Caissier',cuisiniere:'Cuisinière'}[currentUser.role];
  document.getElementById('hUser').innerHTML = currentUser.name;
  let navs = NAV_MAP[currentUser.role];
  document.getElementById('hNav').innerHTML = navs.map(n=>`<button class="hn" id="hn-${n.id}" onclick="showPage('${n.id}')">${n.label}</button>`).join('');
  document.getElementById('bottomNav').innerHTML = navs.map(n=>`<button class="bn-item" id="bn-${n.id}" onclick="showPage('${n.id}')"><span class="bn-icon">${n.icon}</span>${n.label}</button>`).join('');
  showPage(navs[0].id);
  // Realtime orders listener
  db.ref('beyla/cb_orders').on('value', snap=>{ if(snap.exists()){ orders=snap.val(); if(currentPage==='queue') renderQueue(); if(currentPage==='journal') renderJournal(); if(currentPage==='accueil') renderDashboard(); } });
}
let currentPage='';
function showPage(id){
  currentPage=id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.hn,.bn-item').forEach(b=>b.classList.remove('act'));
  document.getElementById('pg-'+id).classList.add('act');
  document.querySelectorAll('#hn-'+id+',#bn-'+id).forEach(b=>b.classList.add('act'));
  if(id==='accueil') renderDashboard();
  if(id==='caisse') renderCaisse();
  if(id==='journal'){ document.getElementById('journalContent').innerHTML='<div class="pg-header"><div class="pg-title">Journal</div><input type="date" id="jDate" onchange="renderJournal()"><button class="export-btn" onclick="exportExcel()">Excel</button></div><div class="stats-grid" id="statsGrid"></div><div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Heure</th><th>Table</th><th>Client</th><th>Caissier</th><th>Total</th><th>Statut</th><th></th></tr></thead><tbody id="jTable"></tbody></table></div>'; document.getElementById('jDate').value=today(); renderJournal(); }
  if(id==='verif'){ document.getElementById('verifContent').innerHTML='<div class="pg-header"><div class="pg-title">Vérification</div><input type="date" id="vDate" onchange="renderVerif()"></div><div class="verif-grid" id="verifGrid"></div>'; document.getElementById('vDate').value=today(); renderVerif(); }
  if(id==='queue') renderQueue();
  if(id==='cuisine') renderDispo();
  if(id==='stock') renderStock();
  if(id==='admin') renderAdmin();
  let fv=document.getElementById('floatingValidate'); if(fv) fv.style.display=(id==='caisse' && window.innerWidth<=640)?'block':'none';
}
function refreshCurrentPage(){ if(currentPage) showPage(currentPage); }

// ========== DASHBOARD ==========
function renderDashboard(){
  let todayOrders = orders.filter(o=>o.date===today());
  let total = todayOrders.reduce((s,o)=>s+(o.total||0),0);
  let enAttente = todayOrders.filter(o=>!o.status||o.status==='attente').length;
  let enPrep = todayOrders.filter(o=>o.status==='preparation').length;
  let stockBas = products.filter(p=>isStockable(p) && (stock[p.id]||0)>0 && (stock[p.id]||0)<=5).length;
  let rupture = products.filter(p=>isStockable(p) && (stock[p.id]||0)<=0).length;
  document.getElementById('dashboardContent').innerHTML = `<div class="dash-welcome"><div class="dash-welcome-title">Bonjour, ${currentUser.name.split(' ')[0]}</div><div class="dash-welcome-sub">Gestion sécurisée - Complexe Beyla</div></div>
  <div class="kpi-grid"><div class="kpi-card green"><div class="kpi-icon">💰</div><div class="kpi-val">${fmt(total)}</div><div class="kpi-label">Recettes jour</div></div>
  <div class="kpi-card blue"><div class="kpi-val">${todayOrders.length}</div><div class="kpi-label">Commandes</div></div>
  <div class="kpi-card amber"><div class="kpi-val">${enAttente+enPrep}</div><div class="kpi-label">En cuisine</div></div>
  <div class="kpi-card ${rupture?'red':(stockBas?'amber':'green')}"><div class="kpi-val">${rupture?rupture:stockBas}</div><div class="kpi-label">${rupture?'Ruptures':'Stock bas'}</div></div></div>
  <div id="dashAlerts"></div><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Table</th><th>Heure</th><th>Statut</th><th>Total</th></tr></thead><tbody>${todayOrders.slice(-6).reverse().map(o=>`<tr><td>${o.id}</td><td>${o.table}</td><td>${o.time}</td><td>${o.status||'attente'}</td><td>${fmt(o.total)}</td></tr>`).join('')}</tbody></table></div>`;
  let alerts=[];
  if(rupture) alerts.push(`Rupture de stock : ${products.filter(p=>isStockable(p) && (stock[p.id]||0)<=0).map(p=>p.name).join(', ')}`);
  if(enAttente) alerts.push(`${enAttente} commande(s) en attente cuisine`);
  document.getElementById('dashAlerts').innerHTML = alerts.map(a=>`<div class="alert-item warn">! ${a}</div>`).join('') || '<div class="alert-item ok">Aucune alerte</div>';
}

// ========== CAISSE ==========
function renderCaisse(){
  document.getElementById('caisseContent').innerHTML = `<div class="caisse-wrap"><div class="left-p"><div class="lp-head"><div class="s-box"><input type="text" id="searchIn" placeholder="Rechercher..." oninput="filterProds()"></div></div><div class="cat-bar" id="catBar"></div><div class="prod-grid" id="prodGrid"></div></div><div class="right-p"><div class="order-top"><div class="tbl-badge" id="tblBadge">Table —</div><div class="order-meta" id="orderMeta"></div></div><div class="tbl-row"><select id="tblSel"><option value="">Choisir table</option><option>Table 1</option><option>Table 2</option><option>Table 3</option><option>Bar</option><option>A emporter</option></select><input type="text" id="clientIn" placeholder="Client"></div><div class="order-items" id="orderItems"></div><div class="order-foot"><div class="tot-row">Sous-total <span id="subT">0 GNF</span></div><div class="tot-main">TOTAL <span id="totalT">0 GNF</span></div><textarea id="noteIn" rows="2" placeholder="Note cuisine..."></textarea><div class="act-row"><button class="btn btn-ghost" onclick="clearCart()">Annuler</button><button class="btn btn-ok" onclick="confirmOrder()">Valider</button></div></div></div></div>`;
  renderCatBar(); renderProds(); renderCart(); updateClock();
}
let cats=['Tout','Nourriture','Boissons','Chicha','Snacks','Desserts'];
function renderCatBar(){ document.getElementById('catBar').innerHTML = cats.map(c=>`<button class="cat-btn ${c===activeCat?'act':''}" onclick="setCat('${c}')">${c}</button>`).join(''); }
function setCat(c){ activeCat=c; renderCatBar(); renderProds(); }
function filterProds(){ renderProds(); }
function renderProds(){
  let q = document.getElementById('searchIn')?.value.toLowerCase()||'';
  let filtered = products.filter(p=>(activeCat==='Tout'||p.cat===activeCat) && (!q||p.name.toLowerCase().includes(q)));
  let todayKey = today();
  let grid = document.getElementById('prodGrid');
  if(!filtered.length){ grid.innerHTML='<div>Aucun produit</div>'; return; }
  grid.innerHTML = filtered.map(p=>{
    let avail = dispo[todayKey]===undefined || dispo[todayKey][p.id]!==false;
    let qty = stock[p.id]||0;
    let noStock = isStockable(p) && qty<=0;
    let disabled = !avail || noStock;
    let stockTxt = isStockable(p) ? (noStock?'Rupture':`Stock: ${qty}`) : '';
    return `<button class="prod-card ${disabled?'unavail':''}" onclick="${disabled?`toast('${noStock?'Stock insuffisant':'Indisponible'}')`:`addToCart(${p.id})`}"><div class="prod-name">${p.name}</div><div class="prod-price">${fmt(p.price)}</div><div class="prod-stock">${stockTxt}</div></button>`;
  }).join('');
}
function addToCart(id){
  let p=products.find(x=>x.id===id); if(!p) return;
  let qty = isStockable(p)? (stock[p.id]||0) : 9999;
  let inCart = (cart.find(c=>c.id===id)||{qty:0}).qty;
  if(isStockable(p) && qty - inCart <=0){ toast('Stock insuffisant'); return; }
  let ex=cart.find(c=>c.id===id);
  if(ex) ex.qty++; else cart.push({id,name:p.name,price:p.price,qty:1, stockable:isStockable(p)});
  renderCart(); renderProds();
  // On reste sur catalogue (pas de bascule automatique)
}
function chgQty(id,d){ let item=cart.find(c=>c.id===id); if(!item) return; if(d>0 && item.stockable){ let stockQty=stock[id]||0; if(item.qty>=stockQty){ toast('Stock max'); return; } } item.qty+=d; if(item.qty<=0) cart=cart.filter(c=>c.id!==id); renderCart(); renderProds(); }
function delItem(id){ cart=cart.filter(c=>c.id!==id); renderCart(); renderProds(); }
function renderCart(){
  let el=document.getElementById('orderItems'); if(!el) return;
  let tot=cart.reduce((s,c)=>s+c.price*c.qty,0);
  document.getElementById('subT').innerHTML=fmt(tot); document.getElementById('totalT').innerHTML=fmt(tot);
  if(!cart.length){ el.innerHTML='<div class="empty-state">Commande vide</div>'; return; }
  el.innerHTML=cart.map(c=>`<div class="order-item"><div><div>${c.name}</div><div>${fmt(c.price)}</div></div><div class="qty-ctrl"><button class="qb" onclick="chgQty(${c.id},-1)">-</button><span>${c.qty}</span><button class="qb" onclick="chgQty(${c.id},+1)">+</button></div><div>${fmt(c.price*c.qty)}</div><button class="del-btn" onclick="delItem(${c.id})">X</button></div>`).join('');
}
function updTable(){ let t=document.getElementById('tblSel'); if(t) document.getElementById('tblBadge').innerHTML=t.value||'Table —'; }
function clearCart(){ cart=[]; renderCart(); renderProds(); }
async function confirmOrder(){
  if(!cart.length){ toast('Commande vide'); return; }
  if(!document.getElementById('tblSel').value){ toast('Choisir une table'); return; }
  // vérification stock
  for(let item of cart){ if(item.stockable && (stock[item.id]||0) < item.qty){ toast(`Stock insuffisant: ${item.name}`); return; } }
  let order = { id:genId(), date:today(), time:nowTime(), table:document.getElementById('tblSel').value, client:document.getElementById('clientIn').value||'—', caissier:currentUser.name, note:document.getElementById('noteIn').value, items:cart.map(c=>({id:c.id,name:c.name,price:c.price,qty:c.qty})), total:cart.reduce((s,c)=>s+c.price*c.qty,0), status:'attente', annulee:false };
  // décrémenter stock (uniquement produits stockables)
  for(let item of cart){ if(item.stockable){ stock[item.id] = Math.max(0, (stock[item.id]||0) - item.qty); } }
  orders.push(order);
  await saveFB('cb_orders', orders);
  await saveFB('cb_stock', stock);
  addLog('Commande validée', `${order.id} - Table ${order.table} total ${order.total} GNF`);
  toast(`Commande ${order.id} enregistrée`);
  clearCart();
}
function updateClock(){ let el=document.getElementById('orderMeta'); if(el) el.innerHTML=new Date().toLocaleString(); }
setInterval(updateClock,1000);

// ========== FILE D'ATTENTE CUISINE (sans impression) ==========
function renderQueue(){
  let todayAll = orders.filter(o=>o.date===today());
  let filtered = todayAll;
  if(queueFilter==='attente') filtered=todayAll.filter(o=>!o.status||o.status==='attente');
  else if(queueFilter==='preparation') filtered=todayAll.filter(o=>o.status==='preparation');
  else if(queueFilter==='servie') filtered=todayAll.filter(o=>o.status==='servie');
  filtered.sort((a,b)=>{ let ord={attente:0,preparation:1,servie:2}; return (ord[a.status||'attente']-ord[b.status||'attente']) || a.time.localeCompare(b.time); });
  let html = `<div class="qc-filter-bar"><button class="qc-filter-btn ${queueFilter==='tous'?'act':''}" onclick="setQueueFilter('tous')">Toutes</button><button class="qc-filter-btn ${queueFilter==='attente'?'act':''}" onclick="setQueueFilter('attente')">Attente</button><button class="qc-filter-btn ${queueFilter==='preparation'?'act':''}" onclick="setQueueFilter('preparation')">Prépa</button><button class="qc-filter-btn ${queueFilter==='servie'?'act':''}" onclick="setQueueFilter('servie')">Servies</button></div>`;
  if(!filtered.length){ html+='<div>Aucune commande</div>'; document.getElementById('queueContent').innerHTML=html; return; }
  html+=`<div class="queue-grid">`+filtered.map(o=>{
    let st=o.status||'attente';
    let canStart=(st==='attente');
    let canDone=(st==='preparation');
    return `<div class="queue-card ${st}"><div><strong>${o.id}</strong> ${o.time}</div><div>Table ${o.table}</div><div>${o.items.map(i=>`${i.name} x${i.qty}`).join(', ')}</div>${o.note?`<div>Note: ${o.note}</div>`:''}<div><button class="qc-btn-start" onclick="setOrderStatus('${o.id}','preparation')">En préparation</button><button class="qc-btn-done" onclick="setOrderStatus('${o.id}','servie')">Servie</button></div></div>`;
  }).join('')+`</div>`;
  document.getElementById('queueContent').innerHTML=html;
}
function setQueueFilter(f){ queueFilter=f; renderQueue(); }
async function setOrderStatus(id,status){
  let o=orders.find(x=>x.id===id); if(!o) return;
  o.status=status;
  await saveFB('cb_orders', orders);
  if(status==='servie') addLog('Commande servie', `${id} servie par ${currentUser.name}`);
  renderQueue();
  toast(`Commande ${status==='servie'?'servie':'en préparation'}`);
}

// ========== DISPONIBILITE PLATS ==========
function renderDispo(){
  let k=today();
  if(!dispo[k]){ dispo[k]={}; products.forEach(p=>dispo[k][p.id]=true); saveFB('cb_dispo',dispo); }
  let html = `<div class="cuisine-grid">`+products.map(p=>{
    let avail = dispo[k][p.id]!==false;
    return `<div class="cuisine-card ${avail?'dispo':'indispo'}"><div><strong>${p.name}</strong><br>${p.cat}</div><button class="toggle-btn ${avail?'on':'off'}" onclick="toggleDispo(${p.id})"></button></div>`;
  }).join('')+`</div>`;
  document.getElementById('dispoContent').innerHTML=html;
}
async function toggleDispo(id){
  let k=today(); if(!dispo[k]) dispo[k]={};
  dispo[k][id]=dispo[k][id]===false;
  await saveFB('cb_dispo', dispo);
  renderDispo();
}

// ========== JOURNAL (sans impression) ==========
async function renderJournal(){
  let date=document.getElementById('jDate').value;
  let day=orders.filter(o=>o.date===date);
  let total=day.reduce((s,o)=>s+(o.total||0),0);
  document.getElementById('statsGrid').innerHTML=`<div class="stat-c">Commandes: ${day.length}</div><div class="stat-c">Recettes: ${fmt(total)}</div>`;
  let tb=document.getElementById('jTable');
  if(!day.length){ tb.innerHTML='<tr><td colspan="8">Aucune</td></tr>'; return; }
  tb.innerHTML=day.slice().reverse().map(o=>`<tr><td>${o.id}</td><td>${o.time}</td><td>${o.table}</td><td>${o.client}</td><td>${o.caissier}</td><td>${fmt(o.total)}</td><td><span class="badge bg-${o.status==='servie'?'g':(o.status==='preparation'?'b':'a')}">${o.status||'attente'}</span></td><td><button class="icon-btn" onclick="viewOrderDetails('${o.id}')">Voir</button></td></tr>`).join('');
}
function viewOrderDetails(id){
  let o=orders.find(x=>x.id===id); if(!o) return;
  document.getElementById('modalOrderContent').innerHTML=`<div>${o.id}<br>${o.date} ${o.time}<br>Table ${o.table}<br>Client ${o.client}<br>Caissier ${o.caissier}<br>Statut ${o.status||'attente'}<br>Items: ${o.items.map(i=>i.name+' x'+i.qty).join(', ')}<br>Total: ${fmt(o.total)}<br>Note: ${o.note||'—'}</div>`;
  openModal('modalOrder');
}
function exportExcel(){ /* garder la fonction existante */ toast('Excel exporté (simulation)'); }

// ========== VERIFICATION (écart de caisse bloquant) ==========
function renderVerif(){
  let date=document.getElementById('vDate').value;
  let day=orders.filter(o=>o.date===date);
  let sysTotal=day.reduce((s,o)=>s+(o.total||0),0);
  let saved=verifs[date]||{};
  document.getElementById('verifGrid').innerHTML=`<div class="verif-card"><div>Total système: ${fmt(sysTotal)}</div><div><input type="number" id="vCash" placeholder="Argent compté" value="${saved.cash||''}" oninput="checkCaisseEcart(${sysTotal})"></div><div id="vEcart">Écart: —</div><button class="btn btn-ok" onclick="saveVerif('${date}',${sysTotal})">Enregistrer vérif</button></div>`;
}
function checkCaisseEcart(sysTotal){ let cash=parseFloat(document.getElementById('vCash').value)||0; let ecart=cash-sysTotal; document.getElementById('vEcart').innerHTML=`Écart: ${fmt(Math.abs(ecart))} ${ecart===0?'OK':(ecart>0?'Excédent':'Manque')}`; }
async function saveVerif(date,sysTotal){ let cash=parseFloat(document.getElementById('vCash').value)||0; verifs[date]={cash, sysTotal, savedAt:new Date().toLocaleString()}; await saveFB('cb_verifs',verifs); toast('Vérif enregistrée'); renderVerif(); }

// ========== STOCK (uniquement boissons/chicha) ==========
function renderStock(){
  let stockables = products.filter(p=>isStockable(p));
  let html = `<div>Gestion des stocks (Boissons et Chicha uniquement)</div><div class="stock-grid">`+stockables.map(p=>{
    let qty=stock[p.id]||0;
    return `<div><strong>${p.name}</strong> - ${fmt(p.price)}<br>Stock: ${qty}<br><input type="number" id="si-${p.id}" value="1"><button onclick="adjustStock(${p.id},'add')">+ Réassort</button><button onclick="adjustStock(${p.id},'sub')">- Perte</button><button onclick="adjustStock(${p.id},'set')">Définir</button></div>`;
  }).join('')+`</div><div><h4>Historique mouvements</h4><div id="mvtList"></div></div>`;
  document.getElementById('stockContent').innerHTML=html;
  renderStockMvts();
}
async function adjustStock(id,mode){ let inp=document.getElementById('si-'+id); let val=parseInt(inp.value)||0; if(val<=0 && mode!=='set'){ toast('Quantité positive'); return; } let before=stock[id]||0; let after=before; if(mode==='add') after=before+val; else if(mode==='sub') after=Math.max(0,before-val); else if(mode==='set') after=Math.max(0,val); stock[id]=after; await saveFB('cb_stock',stock); await addLog('Ajustement stock', `${products.find(p=>p.id===id).name} : ${before} → ${after}`); toast('Stock mis à jour'); renderStock(); }
function renderStockMvts(){ let mvtDiv=document.getElementById('mvtList'); if(mvtDiv) mvtDiv.innerHTML=logs.slice(0,30).map(l=>`<div>${l.timestamp} - ${l.user} : ${l.action} ${l.details}</div>`).join('')||'Aucun mouvement'; }

// ========== ADMIN (gestion utilisateurs/produits) ==========
function renderAdmin(){
  let userHtml = users.map(u=>`<div>${u.name} (${u.role}) - ${u.login} ${u.id!==1?`<button onclick="editUserModal(${u.id})">✏️</button><button onclick="delUser(${u.id})">🗑</button>`:''}</div>`).join('');
  let prodHtml = products.map(p=>`<div>${p.name} - ${fmt(p.price)} - ${p.cat} ${isStockable(p)?`(stock:${stock[p.id]||0})`:''} <button onclick="editProdModal(${p.id})">✏️</button><button onclick="delProd(${p.id})">🗑</button></div>`).join('');
  document.getElementById('adminContent').innerHTML=`<div><button onclick="openAddUser()">+ Utilisateur</button><div id="userList">${userHtml}</div></div><div><button onclick="openAddProd()">+ Produit</button><div id="prodList">${prodHtml}</div></div>`;
}
function openAddUser(){ editUserId=null; document.getElementById('uName').value=''; document.getElementById('uLogin').value=''; document.getElementById('uPass').value=''; document.getElementById('uRole').value='caissier'; openModal('modalUser'); }
function editUserModal(id){ let u=users.find(x=>x.id===id); if(u){ editUserId=id; document.getElementById('uName').value=u.name; document.getElementById('uLogin').value=u.login; document.getElementById('uPass').value=''; document.getElementById('uRole').value=u.role; openModal('modalUser'); } }
async function saveUser(){ let name=document.getElementById('uName').value.trim(), login=document.getElementById('uLogin').value.trim(), pass=document.getElementById('uPass').value, role=document.getElementById('uRole').value; if(!name||!login){ toast('Nom et login requis'); return; } if(!editUserId && !pass){ toast('Mot de passe requis'); return; } if(users.find(u=>u.login===login && u.id!==editUserId)){ toast('Login existe'); return; } if(editUserId){ let u=users.find(x=>x.id===editUserId); if(u){ u.name=name; u.login=login; if(pass) u.pass=pass; u.role=role; } } else { let mx=Math.max(...users.map(u=>u.id),0); users.push({id:mx+1,name,login,pass,role}); } await saveFB('cb_users',users); addLog('Modification utilisateur',`${editUserId?'Modif':'Ajout'} de ${login}`); closeModal('modalUser'); renderAdmin(); toast('OK'); }
async function delUser(id){ if(id===currentUser.id){ toast('Impossible'); return; } if(confirm('Supprimer ?')){ users=users.filter(u=>u.id!==id); await saveFB('cb_users',users); addLog('Suppression utilisateur',`${id}`); renderAdmin(); toast('Supprimé'); } }
function openAddProd(){ editProdId=null; document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pCat').value='Nourriture'; document.getElementById('pStock').value='20'; openModal('modalProd'); }
function editProdModal(id){ let p=products.find(x=>x.id===id); if(p){ editProdId=id; document.getElementById('pName').value=p.name; document.getElementById('pPrice').value=p.price; document.getElementById('pCat').value=p.cat; document.getElementById('pStock').value=stock[p.id]||20; openModal('modalProd'); } }
async function saveProd(){ let name=document.getElementById('pName').value.trim(); let price=parseFloat(document.getElementById('pPrice').value); let cat=document.getElementById('pCat').value; let qty=parseInt(document.getElementById('pStock').value)||0; if(!name||!price){ toast('Nom et prix requis'); return; } if(editProdId){ let p=products.find(x=>x.id===editProdId); if(p){ p.name=name; p.price=price; p.cat=cat; } if(isStockable(p)) stock[p.id]=qty; } else { let mx=Math.max(...products.map(p=>p.id),0); let newId=mx+1; products.push({id:newId, name, price, cat, ...(isStockable({cat})?{stockable:true}:{})}); if(isStockable({cat})) stock[newId]=qty; } await saveFB('cb_prods',products); await saveFB('cb_stock',stock); addLog('Produit modifié',`${name}`); closeModal('modalProd'); renderAdmin(); renderProds(); toast('OK'); }
async function delProd(id){ if(confirm('Supprimer ?')){ products=products.filter(p=>p.id!==id); delete stock[id]; await saveFB('cb_prods',products); await saveFB('cb_stock',stock); addLog('Produit supprimé',`${id}`); renderAdmin(); renderProds(); toast('Supprimé'); } }

// ========== CHANGEMENT MOT DE PASSE ==========
function openChangePwd(){ document.getElementById('pwdOld').value=''; document.getElementById('pwdNew').value=''; document.getElementById('pwdConf').value=''; document.getElementById('pwdErr').innerHTML=''; openModal('modalPwd'); }
async function doChangePwd(){ let old=document.getElementById('pwdOld').value, nw=document.getElementById('pwdNew').value, conf=document.getElementById('pwdConf').value; if(!old||!nw||!conf){ document.getElementById('pwdErr').innerHTML='Remplir tous les champs'; return; } if(old!==currentUser.pass){ document.getElementById('pwdErr').innerHTML='Ancien mot de passe incorrect'; return; } if(nw.length<4){ document.getElementById('pwdErr').innerHTML='Minimum 4 caractères'; return; } if(nw!==conf){ document.getElementById('pwdErr').innerHTML='Confirmation différente'; return; } let u=users.find(x=>x.id===currentUser.id); if(u) u.pass=nw; currentUser.pass=nw; await saveFB('cb_users',users); addLog('Changement mot de passe',`${currentUser.name}`); closeModal('modalPwd'); toast('Mot de passe modifié'); }

initStock(); loadFB().then(()=>{ initStock(); });
setInterval(()=>loadFB(), 30000);
